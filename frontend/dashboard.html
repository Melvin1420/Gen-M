<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gen-M — Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-logo">Gen-M</div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html" class="nav-item active">Dashboard</a>
        <a href="/queue.html" class="nav-item">Tickets</a>
        <span class="nav-item disabled" title="Coming soon">Assets</span>
        <span class="nav-item disabled" title="Admin only, coming soon">Departments</span>
        <span class="nav-item disabled" title="Admin only, coming soon">Users</span>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">Dashboard</div>
        <div class="topbar-user">
          <span id="current-user"></span>
          <button type="button" id="sign-out-btn">Sign out</button>
        </div>
      </header>

      <main class="content">
        <p id="load-error" class="error-message" hidden></p>

        <div class="stat-row">
          <div class="stat-card">
            <span class="stat-value" id="stat-total">0</span>
            <span class="stat-label">Needs attention</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="stat-urgent">0</span>
            <span class="stat-label">Urgent</span>
          </div>
        </div>

        <section class="panel">
          <h2>Needs your attention</h2>
          <p id="empty-state" class="empty-state" hidden>Nothing needs your attention right now.</p>
          <ul id="attention-list" class="attention-list" hidden></ul>
        </section>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
